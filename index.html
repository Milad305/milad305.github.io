<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Disable Cloudflare Rocket Loader for Flutter.js -->
  <script data-cfasync="false" type="text/javascript">
    // Disable Cloudflare Rocket Loader for this script
    window.rocketLoader = false;
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="memberlike">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>memberlike</title>
  <link rel="manifest" href="manifest.json">

  <!-- CORS and security headers -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "154735405";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer data-cfasync="false"></script>

  <style>
    /* Loading screen styles */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }

    .loading-logo {
      width: 170px;
      height: 170px;
      margin-bottom: 20px;
    }

    .loading-logo-container {
      position: relative;
      width: 170px;
      height: 170px;
      margin-bottom: 20px;
    }

    .loading-logo-placeholder {
      width: 170px;
      height: 170px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #3118E9, #6B46C1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(49, 24, 233, 0.3);
    }

    .logo-text {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    .loading-logo {
      width: 170px;
      height: 170px;
      border-radius: 20px;
    }

    .loading-text {
      color: #3118E9;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      margin-bottom: 30px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 5px solid #E7E8FF;
      border-top: 5px solid #3118E9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-screen.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-logo-container">
      <img src="assets/assets/svgs/appLogo.png" alt="Logo" class="loading-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" crossorigin="anonymous">
      <div class="loading-logo-placeholder" style="display: none;">
        <div class="logo-text">MemberLike</div>
      </div>
    </div>
    <div class="loading-text">App for selling social network services</div>
    <div class="loading-spinner"></div>
  </div>

  <script data-cfasync="false">
    // Disable Cloudflare Rocket Loader for this script
    
    // Global variables for navigation handling
    let flutterApp = null;
    let isAppReady = false;

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            flutterApp = appRunner;
            isAppReady = true;
            
            // Hide loading screen when Flutter app is ready
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
              loadingScreen.classList.add('hidden');
            }
            
            appRunner.runApp();
          }).catch(function(error) {
            console.error('Failed to initialize Flutter engine:', error);
            // Show error message to user
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
              loadingScreen.innerHTML = '<div style="text-align: center; color: red;">Failed to load app. Please refresh the page.</div>';
            }
          });
        }
      });
    });

    // Handle browser back/forward navigation
    window.addEventListener('popstate', function(event) {
      if (isAppReady && flutterApp) {
        console.log('Popstate event:', event.state);
        // The Flutter app will handle this through the WebRoutingService
        // Don't trigger additional navigation here to prevent loops
      }
    });

    // Handle browser back button
    window.addEventListener('beforeunload', function(event) {
      // This can be used to save state before leaving
      console.log('Page is being unloaded');
    });

    // Global error handler for unhandled errors
    window.addEventListener('error', function(event) {
      console.error('Global error:', event.error);
      // Don't let the error crash the app
      event.preventDefault();
    });

    // Handle unhandled promise rejections
    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled promise rejection:', event.reason);
      // Don't let the error crash the app
      event.preventDefault();
    });

    // Function to handle navigation from Flutter
    window.handleFlutterNavigation = function(route) {
      console.log('Flutter navigation to:', route);
      // Update browser history without triggering popstate
      if (route && route !== window.location.hash) {
        const newUrl = window.location.origin + '#' + route;
        window.history.pushState({ route: route }, '', newUrl);
      }
    };


  </script>
</body>
</html>
